<!doctype html>
<html lang="en">

<head>
	<!-- 👋👋👋 Hello dear code reader, have fun understanding how YT works without ads. -->
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>YT Minimal Player</title>

	<link rel="dns-prefetch" href="//www.youtube.com">
	<link rel="dns-prefetch" href="//www.youtube-nocookie.com">
	<link rel="dns-prefetch" href="//i.ytimg.com">
	<link rel="preconnect" href="https://www.youtube.com" crossorigin>
	<link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin>
	<link rel="preload" href="https://www.youtube.com/iframe_api" as="script">

	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		#player-container {
			width: 100%;
			height: 100%;
			position: fixed;
			top: 0;
			left: 0;
			background: #000000;
		}
	</style>
</head>

<body>
	<div id="player-container"></div>

	<script>
		"use strict";

		// Get parameter from hash first, then fall back to query parameters
		function getParameter(name) {
			// Try hash parameters first
			const hash = window.location.hash.substring(1); // Remove '#'
			if (hash) {
				const hashParams = new URLSearchParams(hash);
				const hashValue = hashParams.get(name);
				if (hashValue) return hashValue;
			}

			// Fall back to query parameters for backwards compatibility
			const urlParams = new URLSearchParams(window.location.search);
			if (urlParams.get(name)) return urlParams.get(name);

			return null;
		}

		const bridgeVersion = 1;
		const requestedBridgeInstanceId = getParameter('instance') || '';
		const bridgeInstanceId = /^[a-zA-Z0-9_-]{1,64}$/.test(requestedBridgeInstanceId)
			? requestedBridgeInstanceId
			: '';
		let bridgeParentOrigin = null;

		if (getParameter('bridge') === '1' && bridgeInstanceId) {
			try {
				const requestedOrigin = new URL(getParameter('origin'));
				if (requestedOrigin.protocol === 'http:' || requestedOrigin.protocol === 'https:') {
					bridgeParentOrigin = requestedOrigin.origin;
				}
			} catch (error) {
				console.log('ERROR:Invalid web relay parent origin');
			}
		}

		function postBridgeMessage(type, data) {
			if (!bridgeParentOrigin || window.parent === window) return;

			window.parent.postMessage({
				...data,
				source: 'cinema-youtube',
				version: bridgeVersion,
				instanceId: bridgeInstanceId,
				type: type
			}, bridgeParentOrigin);
		}

		function getBridgeState() {
			const controller = window.cinema_controller;
			let duration = 0;
			let muted = true;
			let playerState = null;

			if (player) {
				try { duration = Number(player.getDuration()) || 0; } catch (error) {}
				try { muted = player.isMuted(); } catch (error) {}
				try { playerState = player.getPlayerState(); } catch (error) {}
			}

			return {
				currentTime: controller ? Number(controller.currentTime) || 0 : 0,
				paused: controller ? controller.paused : true,
				duration: duration,
				volume: controller ? Number(controller.volume) || 0 : 0,
				muted: muted,
				playerState: playerState
			};
		}

		function postBridgeState() {
			postBridgeMessage('state', getBridgeState());
		}

		window.addEventListener('message', function (event) {
			if (!bridgeParentOrigin || event.source !== window.parent || event.origin !== bridgeParentOrigin) return;

			const message = event.data;
			if (!message || message.source !== 'cinema-webrelay' ||
				message.version !== bridgeVersion || message.instanceId !== bridgeInstanceId ||
				message.type !== 'command') return;

			const controller = window.cinema_controller;
			if (!controller && message.command !== 'getState') return;

			switch (message.command) {
				case 'play':
					controller.play();
					break;
				case 'pause':
					controller.pause();
					break;
				case 'seek': {
					const seconds = message.value;
					if (typeof seconds !== 'number' || !Number.isFinite(seconds)) return;
					const duration = player ? Number(player.getDuration()) || 0 : 0;
					controller.currentTime = Math.max(0, duration > 0 ? Math.min(seconds, duration) : seconds);
					break;
				}
				case 'setVolume': {
					const volume = message.value;
					if (typeof volume !== 'number' || !Number.isFinite(volume)) return;
					controller.volume = Math.max(0, Math.min(volume, 1));
					break;
				}
				case 'setMuted':
					if (!player || typeof message.value !== 'boolean') return;
					if (message.value) {
						player.mute();
					} else {
						player.unMute();
					}
					break;
				case 'getState':
					break;
				default:
					return;
			}

			postBridgeState();
		});

		const tag = document.createElement('script');
		tag.src = "https://www.youtube.com/iframe_api";
		tag.onerror = function () {
			console.log("ERROR:Failed to load YouTube IFrame API");
			postBridgeMessage('error', { message: 'Failed to load YouTube IFrame API' });
		};
		document.head.appendChild(tag);

		let player = null;

		const defaultPlayerVars = {
			controls: 0,       // Hide native controls
			rel: 0,            // Disable related videos
			loop: 0,           // No loop
			disablekb: 1,      // Disable keyboard shortcuts
			enablejsapi: 1,    // Enable JS API for custom controls
			muted: 1,		   // Set to play muted
			cc_load_policy: 0, // Do not display subtitles automatically
			iv_load_policy: 3, // Do not display video annotations
			autoplay: 1		   // Set to make it autostart
		};

		const startPaused = getParameter('paused') === '1';

		function onYouTubeIframeAPIReady() {
			const rawVid = getParameter('v');
			const vid = (rawVid && /^[a-zA-Z0-9_-]{11}$/.test(rawVid))
				? rawVid
				: 'dQw4w9WgXcQ';

			const startTime = Math.max(0, parseFloat(getParameter('t')) || 0);

			if (startPaused) {
				defaultPlayerVars.autoplay = 0; // don't autostart when paused
			}

			createPlayer(vid, startTime);
		}

		function createPlayer(videoId, startTime) {
			if (player && typeof player.destroy === 'function') {
				player.destroy();
				player = null;
				document.getElementById('player-container').innerHTML = '';
			}

			player = new YT.Player('player-container', {
				height: '100%',
				width: '100%',
				videoId: videoId,
				playerVars: {
					...defaultPlayerVars,
					start: Math.floor(startTime)  // YouTube API supports start parameter
				},
				host: 'https://www.youtube-nocookie.com',
				events: {
					onReady: () => {
						wrapper._ready = true;

						// Additional seek if needed (for more precise timing)
						if (startTime > 0) {
							player.seekTo(startTime, true);
						}

						// Honor a paused start (URL param or an early pause() call)
						if (startPaused || wrapper._desiredPaused) {
							player.pauseVideo();
						}

						window.cinema_controller = wrapper;
						if (typeof exTheater !== 'undefined' && exTheater &&
							typeof exTheater.controllerReady === 'function') {
							exTheater.controllerReady();
						}
						postBridgeMessage('ready', {});
						postBridgeState();
					},
					onStateChange: (e) => {
						if (e.data === YT.PlayerState.PLAYING) {
							wrapper._paused = false;
						} else if (e.data === YT.PlayerState.PAUSED ||
							e.data === YT.PlayerState.ENDED) {
							wrapper._paused = true;
						}

						// YouTube re-loads the captions module when playback actually
						// begins, so unload it again on PLAYING/BUFFERING to keep subtitles off.
						if (e.data === YT.PlayerState.PLAYING ||
							e.data === YT.PlayerState.BUFFERING) {
							player.unloadModule('captions');
						}

						postBridgeState();
					},
					onError: (e) => {
						postBridgeMessage('error', { message: 'YouTube player error', code: e.data });
					},
					onApiChange: () => {
						// Captions module has (re)loaded — force it off. Cover both
						// module name variants and clear any active track, since
						// unloadModule alone is unreliable across player builds.
						try { player.unloadModule('captions'); } catch (e) {}
						try { player.unloadModule('cc'); } catch (e) {}
						try { player.setOption('captions', 'track', {}); } catch (e) {}
						try { player.setOption('cc', 'track', {}); } catch (e) {}
					},
				}
			});

			const wrapper = {
				_ready: false,
				_paused: true,
				_desiredPaused: false,
				play() {
					this._desiredPaused = false;
					this._paused = false;
					if (this._ready) player.playVideo();
				},
				pause() {
					this._desiredPaused = true;
					this._paused = true;
					if (this._ready) player.pauseVideo();
				},

				get currentTime() {
					return this._ready ? player.getCurrentTime() : 0;
				},
				set currentTime(time) {
					if (this._ready) player.seekTo(time, true);
				},

				get volume() {
					return this._ready ? player.getVolume() / 100 : 1;
				},
				set volume(v) {
					if (this._ready) {
						if (player.isMuted()) {
							player.unMute();
						}

						player.setVolume(v * 100);
					}
				},

				get paused() {
					return this._paused;
				}
			};
		}

		/**
		 * Handle edge case if API already loaded
		 */
		if (window.YT && window.YT.Player && !player) {
			if (document.readyState === 'complete') {
				onYouTubeIframeAPIReady();
			} else {
				window.addEventListener('load', onYouTubeIframeAPIReady);
			}
		}

	</script>
</body>

</html>
