# Include this location in the server block hosting Cinema's static public files.
location = /media-proxy {
    proxy_pass http://127.0.0.1:8090/media-proxy;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 60m;
    proxy_send_timeout 60m;
}
